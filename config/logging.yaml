version: 1
disable_existing_loggers: false

formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

# 파일 핸들러(RotatingFileHandler)가 필요하면 여기에 추가한다 — 대상 디렉터리가 없으면 기동이 실패하므로
# 기본 설정에는 두지 않는다.
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  # 시스템 오류 이벤트(agent.error_events) 수집 — ERROR 이상 + extra 로 지정한 WARNING 만 받는다.
  # emit 은 메모리 버퍼에만 넣는다(I/O 없음). agent_arch/services/monitoring/error_events.py 참조.
  error_events:
    class: agent_arch.services.monitoring.error_events.ErrorEventHandler
    level: WARNING

loggers:
  agent_arch:
    level: DEBUG
    handlers: [console, error_events]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  httpx:
    level: WARNING
    handlers: [console]
    propagate: false

  httpcore:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, error_events]
