tools:
  # ---------------------------------------------------------------------------
  # exposure: 노출 티어 — core(상시 바인딩) | retrieved(질의 검색 시만 바인딩).
  # 생략 시 도구 클래스 기본값(core). 해석 우선순위·폴백 규칙은
  # app/agents/tools/exposure.py 참조.
  #   - retrieved는 UNIFIED_TOOL_INDEXING=true일 때만 유효 (off면 core 승격 폴백)
  #   - core는 범용(도메인 무관) 도구만 — 정원 15개 초과 시 기동 경고
  # ---------------------------------------------------------------------------
  # 웹 검색(사외 공개 정보) — 구 `search` 껍데기 대체. dev 검증을 위해 ON(2026-09-15). 운영(main) 반영 전엔
  # 웹 검색 = 브레이브 검색 MCP 서버(deploy/brave-mcp) 도구 3종. 등록은 BRAVE_MCP_URL 이 있을 때 lifespan 이 한다.
  # core 가 아니라 retrieved — 상시 바인딩일 때 사내 질문(재고·발주·채널)을 웹으로 보내는 오호출이
  # 120일 22건 중 대부분이었다(2026-09-08 실측). 회사 게이트·한도·검색어 감사는 services/web/guard.
  brave_llm_context:
    enabled: true
    exposure: retrieved
    description: "Web research: search the public web and return extracted page content (text chunks) with source URLs in one call. Use for trends, prices, research, comparisons. Not for internal company data."
  brave_web_search:
    enabled: true
    exposure: retrieved
    description: "Search the EXTERNAL public web for links (title, URL, one-line description). Use to find sites/pages or when llm_context returns nothing. Not for internal company data."
  brave_news_search:
    enabled: true
    exposure: retrieved
    description: "Search recent news on the public web (title, URL, published date, summary). Use for latest news/announcements/trends. Not for internal company data."
  # 페이지 실시간 읽기(자체 구현, SSRF 가드). 검색 인덱스 조각은 갱신이 늦어 최신 값(가격지수 9월치 등)을 못 보여 줄 때 원 페이지를 연다.
  # 이번 턴 검색 결과·사용자 입력에 나온 URL 만 연다(app/agents/tools/web_fetch).
  web_fetch:
    enabled: true
    exposure: retrieved
  # 웹 관문은 전역 OFF(fail-closed). 패널 토글(web_search=true) ∧ 회사 설정(agent_web_search_enabled)이 켜진 요청에서만
  # 엔드포인트가 with_domain_gateway 로 얹는다(app/api/v1/agent._apply_web_search). 물류 채널과 같은 패턴.
  find_web_tools:
    enabled: false
    exposure: core
    description: "웹(사외 공개 정보) 도구 탐색 — 실제 카드 문안은 tool_search._DOMAIN_TOOLS"

  # 메신저 SCMS 발주요청 — 요청 단위 opt-in(메신저 ∧ SCMS_MESSENGER_COMPANIES 회사). 관문도 도구도
  # 전역으로는 꺼 둔다: 꺼 두면 상시 노출·검색 인덱스 어디에도 없어서 패널·다른 회사에서는 찾을 길이
  # 없다. 켜진 요청에서만 봇이 도구를 직접 얹는다(tools/skills/scms_order.scms_order_tools).
  find_scms_order_tools:
    enabled: false
    exposure: core
    description: "메신저 SCMS 발주요청 도구 탐색 — 실제 카드 문안은 tool_search._DOMAIN_TOOLS"
  scms_order_request_draft:
    enabled: false
    exposure: retrieved
    description: "메신저 대화로 SCMS 발주요청서 초안을 만들고 값이 채워진 화면 링크를 준다(승인 필요)"
  # 메신저 SCMS 견적 합의(고객사 문의 방) — 검색 인덱스 밖. SCMS 팀 채널의 메신저 봇만 static 으로 얹는다
  # (exposure.apply_scms_messenger_bot). 등록은 승인 카드 필수(hitl/policy).
  scms_quote_agreement:
    enabled: false
    exposure: retrieved
    description: "공급사 견적서를 발주 품목에 맞춘 합의본으로 정리하고 네고를 판으로 쌓아 양측 확인을 받는다"
  scms_quote_submit:
    enabled: false
    exposure: retrieved
    description: "양측이 확인한 합의본의 등록 카드를 공급사 담당자에게 보낸다(공급사가 누르면 그 세션으로 SCMS 견적 등록·수정)"
  # 메신저 SCMS 계약서 파트 — 검색 인덱스 밖. 낙찰·수정·서명 카드를 당사자에게 보낸다(쓰기는 카드 버튼).
  scms_contract_start:
    enabled: false
    exposure: retrieved
    description: "낙찰 카드 → 계약서 발행 → 합의 납기 대조·수정 → 서명 안내 → 체결을 단계에 맞는 카드로 이어 간다"

  # 예약 작업 — ENABLE_SCHEDULED_JOBS 로 켠다. 관문·도구 모두 전역으로는 꺼 둔다(상시 노출·검색 인덱스 밖).
  # 기능이 켜진 요청에서 orchestrator 가 schedule_tools() 로 직접 붙인다(tools/skills/schedule).
  find_schedule_tools:
    enabled: false
    exposure: core
    description: "예약 작업 도구 탐색 — 실제 카드 문안은 tool_search._DOMAIN_TOOLS"
  schedule_create:
    enabled: false
    exposure: retrieved
    description: "반복 요청을 예약(매일·평일·매주·매월·한 번) — 그 시각에 대신 실행하고 헤더 알림(승인 필요)"
  schedule_list:
    enabled: false
    exposure: retrieved
    description: "내 예약 목록 — 이름·할 일·일정·다음 실행·상태"
  schedule_delete:
    enabled: false
    exposure: retrieved
    description: "예약 하나 삭제 — 다음 회차부터 실행하지 않음"

  # 도메인별 도구 탐색 메타도구 (2단 노출 — LLM 주도 발견). 범용 tool_search 대신
  # 도메인별로 분리 노출 → 이름이 곧 의도라 경량 모델도 정확히 호출.
  # 실제 description 은 코드(tool_search.py get_description)가 도메인별 예시까지 포함해 생성.
  # exposure/enabled 는 클래스 기본값(core/enabled)이라 별도 강제 불필요하나 명시해 둔다.
  find_messenger_tools:
    enabled: true
    exposure: core
    description: "메신저(Mattermost) 도구 탐색 — 채널/DM 조회·요약·전송, 채널 검색, 리액션"
  find_mail_tools:
    enabled: true
    exposure: core
    description: "메일 도구 탐색 — 메일함 조회, 읽기, 발송"
  find_calendar_tools:
    enabled: true
    exposure: core
    description: "일정 도구 탐색 — 조회, 등록, 수정, 삭제"
  find_drive_tools:
    enabled: true
    exposure: core
    description: "드라이브 도구 탐색 — 폴더 조회, 파일 검색, 파일 본문 읽기·요약, 문서 내용 검색, 공유 링크"
  find_hr_tools:
    enabled: true
    exposure: core
    description: "인사/근태 도구 탐색 — 근태·출결, 휴가 조회(잔여·내역·종류), 급여, 계약, 자산, 직원 검색 (휴가 신청은 전자결재)"
  find_eapproval_tools:
    enabled: true
    exposure: core
    description: "전자결재 도구 탐색 — 휴가신청서 등 문서 작성·상신(신청/제출/올리기), 결재 승인·미결 확인, 문서함/결재함 조회"
  # MES 앱 PoC 데모 셋(mespoc_*, 도메인 mespoc) 의 관문 — 2026-08-24 격리(구
  # find_mes_tools). 레거시 물류 서비스 연동 도구(mespoc_skill_* 10종 +
  # mespoc_service_* 동적)는 MES 앱 채팅/음성 채널 전용이므로 전역 스위치 OFF
  # (fail-closed) — 일반 채팅의 core 바인딩·인덱싱·프롬프트 광고에서 모두 빠진다.
  # 앱 채널은 apply_logistics_bot 이 with_domain_gateway(ToolRegistry.get — enabled
  # 우회)로 런타임 주입해 연다.
  find_mespoc_tools:
    enabled: false
    exposure: core
    description: "MES 앱 데모(PoC) 물류/생산 스킬 탐색 — 레거시 물류 서비스 연동: 생산 현황·재고·작업지시·품질 처리"
  find_account_tools:
    enabled: true
    exposure: core
    description: "회계 도구 탐색 — 매입매출전표 입력·등록(세금계산서·건별·카드 거래, 전표 입력·전표 등록)"
  # 장기 사용자 메모리 도구 탐색 (Phase 2 Slice 2a) — 과거 지시·선호·별칭·작업 이력 조회.
  # 장기 메모리는 사용자에게 내놓는 메뉴가 아니라 내부 기능이다 — 안내에서만 뺀다.
  # advertise:false = "무엇을 할 수 있어?" 답변·도메인 라벨에서 제외(_enabled_domains).
  # enabled:true 는 유지해야 한다 — memory_read_scene·recall_conversation 이 retrieved 티어라
  # 이 관문으로 발견된다. 2026-09-08 에 안내를 끄려고 enabled 를 내렸다가 그 둘이 고아가 됐고,
  # 매 턴 주입되는 회상 안내문은 여전히 이 관문을 가리켜 죽은 지시가 됐다.
  find_memory_tools:
    enabled: true
    advertise: false
    exposure: core
    description: "장기 사용자 메모리 도구 탐색 — 과거 지시·선호, 별칭(표현→실제 대상), 업무 사실, 지난 작업 이력 조회"
  # 명시적 저장 — "기억해둬/앞으로 ~해"는 언제든 오므로 발견 없이 상시 바인딩(core).
  memory_remember:
    enabled: true
    exposure: core
    description: "사용자가 명시한 지시·선호·사실을 장기 기억에 저장 ('앞으로 ~해','기억해둬'; 실시간 값 제외)"
  # 잊기/정정 — "그거 잊어줘/취소"도 언제든 오므로 상시 바인딩(core). memory_remember 의 반대.
  memory_forget:
    enabled: true
    exposure: core
    description: "잘못 저장됐거나 맞지 않는 기억 1건을 삭제 ('그거 잊어줘','~취소'; memory_search 로 id 확보 후 호출)"
  # 검색 도구 — 회상 안내가 "부족하면 memory_search" 를 가리키므로 발견 없이 상시 바인딩(core).
  memory_search:
    enabled: true
    exposure: core
    description: "사용자 장기 메모리 검색 — 과거에 밝힌 지시·선호·별칭·사실·작업 이력을 질의로 조회 (본인 것만, 실시간 값 제외)"
  recall_conversation:
    enabled: true
    exposure: retrieved
    description: "사용자 과거 대화 원문 검색 — 정제 메모리가 아닌 실제 오갔던 대화를 세션 넘어 조회 (본인 것만)"
  # 메모리 v2 L2 장면 문서 전문 읽기 — 시스템 프롬프트의 장면 내비게이션에서 이름을 보고 깊이 읽을 때.
  memory_read_scene:
    enabled: true
    exposure: retrieved
    description: "장기 메모리 장면 문서 전문 읽기 — 프롬프트의 '기억 장면' 목록에 있는 이름으로 프로젝트·루틴 맥락 전체를 열람 (본인 것만)"
  # 물류(logistics) 도메인 관문 — 물류 MCP(erp, logistics_* 9종) 소유.
  # 2026-08-24 도메인 스왑: 종전에는 레거시 물류 스킬의 fail-closed 스위치로 OFF 였으나,
  # 레거시가 mespoc_*/mes 도메인으로 격리되면서 이 도메인은 일반 채팅에 개방한다
  # (ON = core 바인딩 + 인덱싱 + 프롬프트 광고. supervisor 라우팅 허용은
  #  router._SUPERVISOR_EXCLUDED_DOMAINS 에서 별도 관리). 노출은 요청자
  # logistics.access 권한 게이트(plan_tools)가 사용자별로 최종 통제한다.
  # 2026-09-03 운영 비노출: 물류 MCP 는 개발기 검증 중이라 운영에서는 관문을 내린다.
  # OFF = core 바인딩 + 기능 안내(system._enabled_domains → DOMAIN_CAPABILITY_BULLETS·
  # DOMAIN_LABELS)에서 함께 빠진다. 도구 실물은 배포 설정 의 LOGISTICS_MCP_URL/
  # LOGISTICS_MCP_TOKEN 을 비워 미등록시킨다 — 둘 다 필요하다: env 만 비우면 도구가
  # 0개인데 소개 문구는 남고, 관문만 내리면 UNIFIED_TOOL_INDEXING 의 직접 검색
  # (orchestrator._search_dynamic_tools)이 registry 도구를 그대로 바인딩한다.
  # ⚠️ dev 에는 머지하지 말 것 — 개발기·로컬 검증이 같이 죽는다.
  # 2026-10-07 운영 재개방: 수주서 등록(logistics_create_sales_order, 승인 도구) 도입과 함께
  # 개발기·운영 모두 관문을 다시 연다(사용자 결정). MES 관문(find_mes_tools)은 그대로 닫아 둔다.
  find_logistics_tools:
    enabled: true
    exposure: core
    description: "물류/생산(ERP) 도구 탐색 — 판매(견적·수주·출고·수금)/구매(요청·발주·입고·지급)/생산·외주 문서, 재고(현재고·수불·이동·조정·평가), 채권채무, 품목·BOM·창고 마스터 (카탈로그 v2 33종 — 실제 카드 문안은 tool_search._DOMAIN_TOOLS)"

  # MES 도메인 관문 (2026-08-26 카탈로그 v2 — 물류 MCP mes_* 7종: LOT·라우팅·현장
  # 마스터, 권한 mes.access). 일반 채팅 개방(find_logistics_tools 와 동급).
  # ⚠️ 레거시 PoC 격리 세트의 옛 관문 이름이 find_mes_tools 였다가 2026-08-24
  # find_mespoc_tools 로 리네임되어 이 이름이 해방됨 — mespoc 와 무관하다.
  # 2026-09-03 운영 비노출 — find_logistics_tools 와 같은 서버(물류 MCP)의 MES 축이라
  # 함께 내린다. 근거·복구 방법은 위 주석 참조.
  find_mes_tools:
    enabled: false
    exposure: core
    description: "MES(제조현장) 도구 탐색 — 생산 LOT(작업실적)·공정별 실적·불량내역, 공정순서(라우팅), 공정/설비/불량유형/검사항목 마스터"

  # 가이드 KB 검색 — guide 모드 전용에서 agent(ReAct) 모드 CORE 로 확장 (통합 1단계).
  # core 인 이유: "~어떻게 해?" how-to 질문은 도메인 탐색(find_*_tools)으로 가지 않고
  # 곧바로 들어오며, 도구가 안 붙으면 3갈래 분기 문구(prompt_guidance)도 함께 사라진다.
  # ※ 끄면 agent 모드만 꺼진다 — guide 모드는 orchestrator 가 별도 인스턴스로 직접 실행.
  search_user_guide_kb:
    enabled: true
    exposure: core
    description: "Agent 사용자 가이드 검색 — 사용법·절차·정책·기능유무 how-to 질문 전용 (실 데이터 조회 아님)"

  # DMP 회사 설정 화면 열기 — "권한 설정 어떻게 해?" 류 안내를 화면과 함께 준다.
  # core 인 이유: 이 질문은 도메인 탐색(find_*_tools)으로 가지 않고 곧바로 들어오며,
  # 도구가 안 붙으면 안내 문구(prompt_guidance)도 함께 사라진다.
  dmp_settings_open_screen:
    enabled: true
    exposure: core
    description: "DMP 회사 정보 설정 화면(역할별 권한관리·직원별 권한부여·조직 설정 등)을 옆 화면에 띄움"

  # 사내 디렉터리(사람 찾기) — 도메인 횡단(회의·DM·담당자 확인)이라 상시 노출(core).
  # 범위는 Frappe 가 요청자 계열사로 스코핑. Mattermost 사용자 검색을 대체한다.
  search_colleagues:
    enabled: true
    exposure: core
    description: "사내 디렉터리에서 이름·직책·부서로 동료(사람) 검색·나열 (계열사 범위, 부서/회사 필터)"

  # 조직 구조 browse — 사람 검색(search_colleagues)과 한 묶음이라 상시 노출(core).
