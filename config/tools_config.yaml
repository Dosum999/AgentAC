    exposure: retrieved
    description: "채널명·사용자명으로 Mattermost 메시지 조회 (ID 자동 해결) — 각 메시지의 **첨부 파일명·file_id 포함**(방금 올라온 파일은 색인 대신 이걸로 찾는다)"

  mattermost_skill_get_direct_messages:
    enabled: true
    exposure: retrieved
    description: "사용자 이름으로 DM 메시지 조회"

  mattermost_skill_get_unread_messages:
    enabled: true
    exposure: retrieved
    description: "안 읽은 멘션 조회 — 나를 멘션했거나 내게 온 DM 중 안 읽은 것(빨간 배지 기준)을 모든 채널/DM에서 본문까지 모아 조회"

  # 나를 태그한 메시지 — core(상시 바인딩). 이유는 provider.py 정책 주석 참조:
  # 의미검색은 색인의 `@영문ID`와 질문의 한글 이름을 잇지 못해 원리적으로 못 찾는다.
  mattermost_skill_find_my_mentions:
    enabled: true
    exposure: core
    description: "나를 태그·멘션·언급한 메시지 조회 — '나 태그한 거', '누가 날 불렀어', '내 이름 언급된 글'을 기간별로 전 채널에서 정확히 조회(읽음 여부 무관)"

  # 작성자로 글 찾기 — core(상시 바인딩). 이유는 provider.py 정책 주석 참조:
