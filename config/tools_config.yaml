    description: "특정 사람이 작성한 글 조회 — '김철수 이사님이 공유한 링크', '내가 올린 문서', '○○님이 쓴 글'을 작성자 조건(from:)으로 정확히 검색(author 생략 시 본인, 기간 미지정 시 전체)"

  mattermost_skill_get_my_channels:
