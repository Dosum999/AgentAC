  # 부르지 않고** 전송 도구에 없는 파일명을 지어 넣는 실패가 실측됐다 — 선택지를 하나로
  # 줄여 "무엇을 부를까" 판단을 없앤다. CORE 정원(_CORE_CAP=15) 초과 완화도 겸한다.
  create_file:
