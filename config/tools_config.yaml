  mattermost_skill_find_channels:
    enabled: true
    exposure: retrieved
    description: "자연어 query로 관련 Mattermost 채널 탐색 (채널명 모를 때 사용)"

  mattermost_skill_send_dm:
    enabled: true
    exposure: retrieved

  mattermost_skill_react:
    enabled: true
    exposure: retrieved

  mattermost_post_message:
    enabled: true
    exposure: retrieved

  mattermost_open_screen:
    enabled: true
    exposure: retrieved
