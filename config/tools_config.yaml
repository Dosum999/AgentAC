  # 회계 스니펫 재생 MCP 도구 (accounting-replay-mcp 서버 :8772 — playwright-mcp 재생 엔진 PoC).
  # description 은 문서용 — LLM 이 보는 설명은 MCP 서버 list_tools 가 소유(RemoteMCPTool).
  accounting_replay_create_card_voucher:
    enabled: true
    exposure: retrieved
    description: "카드 경비 전표(57.카과) 1건 입력 — 일자·품명(상호)·공급가액(부가세 자동)·거래처(카드사)를 받아 확인 카드 미리보기 후 승인 시 스니펫 재생으로 실제 입력(confirm 은 시스템 제어)"

  vector_search:
    enabled: true
    description: "Search through vector embeddings"
    top_k: 5
    score_threshold: 0.7

# 도구 사용 제한
limits:
  max_tool_calls_per_run: 20
  tool_timeout: 60

# 도구 조합 규칙
combinations:
  research:
    - search
    - vector_search
  data_analysis:
    - database
    - calculator
