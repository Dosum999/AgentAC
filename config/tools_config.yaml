tools:
  # ---------------------------------------------------------------------------
  # exposure: 노출 티어 — core(상시 바인딩) | retrieved(질의 검색 시만 바인딩).
  # 생략 시 도구 클래스 기본값(core). 해석 우선순위·폴백 규칙은
  # app/agents/tools/exposure.py 참조.
  #   - retrieved는 UNIFIED_TOOL_INDEXING=true일 때만 유효 (off면 core 승격 폴백)
  #   - core는 범용(도메인 무관) 도구만 — 정원 15개 초과 시 기동 경고
  # ---------------------------------------------------------------------------
  # 웹 검색(사외 공개 정보) — 구 `search` 껍데기 대체. dev 검증을 위해 ON(2026-09-15). 운영(main) 반영 전엔
  # 웹 검색 = 브레이브 검색 MCP 서버(deploy/brave-mcp) 도구 3종. 등록은 BRAVE_MCP_URL 이 있을 때 lifespan 이 한다.
  # core 가 아니라 retrieved — 상시 바인딩일 때 사내 질문(재고·발주·채널)을 웹으로 보내는 오호출이
  # 120일 22건 중 대부분이었다(2026-09-08 실측). 회사 게이트·한도·검색어 감사는 services/web/guard.
  brave_llm_context:
    enabled: true
    exposure: retrieved
    description: "Web research: search the public web and return extracted page content (text chunks) with source URLs in one call. Use for trends, prices, research, comparisons. Not for internal company data."
  brave_web_search:
    enabled: true
    exposure: retrieved
    description: "Search the EXTERNAL public web for links (title, URL, one-line description). Use to find sites/pages or when llm_context returns nothing. Not for internal company data."
  brave_news_search:
    enabled: true
    exposure: retrieved
    description: "Search recent news on the public web (title, URL, published date, summary). Use for latest news/announcements/trends. Not for internal company data."
  # 페이지 실시간 읽기(자체 구현, SSRF 가드). 검색 인덱스 조각은 갱신이 늦어 최신 값(가격지수 9월치 등)을 못 보여 줄 때 원 페이지를 연다.
  # 이번 턴 검색 결과·사용자 입력에 나온 URL 만 연다(app/agents/tools/web_fetch).
  web_fetch:
    enabled: true
    exposure: retrieved
  # 웹 관문은 전역 OFF(fail-closed). 패널 토글(web_search=true) ∧ 회사 설정(agent_web_search_enabled)이 켜진 요청에서만
  # 엔드포인트가 with_domain_gateway 로 얹는다(API 계층의 웹 검색 opt-in 처리). 전용 앱 채널과 같은 패턴.
  find_web_tools:
    enabled: false
    exposure: core
    description: "웹(사외 공개 정보) 도구 탐색 — 실제 카드 문안은 tool_search._DOMAIN_TOOLS"

  # 도메인별 도구 탐색 메타도구 (2단 노출 — LLM 주도 발견). 범용 tool_search 대신
  # 도메인별로 분리 노출 → 이름이 곧 의도라 경량 모델도 정확히 호출.
  # 실제 description 은 코드(tool_search.py get_description)가 도메인별 예시까지 포함해 생성.
  # exposure/enabled 는 클래스 기본값(core/enabled)이라 별도 강제 불필요하나 명시해 둔다.
  find_messenger_tools:
    enabled: true
    exposure: core
    description: "메신저(Mattermost) 도구 탐색 — 채널/DM 조회·요약·전송, 채널 검색, 리액션"
  find_mail_tools:
    enabled: true
    exposure: core
    description: "메일 도구 탐색 — 메일함 조회, 읽기, 발송"
  find_calendar_tools:
    enabled: true
    exposure: core
    description: "일정 도구 탐색 — 조회, 등록, 수정, 삭제"
  find_drive_tools:
    enabled: true
    exposure: core
    description: "드라이브 도구 탐색 — 폴더 조회, 파일 검색, 파일 본문 읽기·요약, 문서 내용 검색, 공유 링크"
  find_hr_tools:
    enabled: true
    exposure: core
    description: "인사/근태 도구 탐색 — 근태·출결, 휴가 조회(잔여·내역·종류), 급여, 계약, 자산, 직원 검색 (휴가 신청은 전자결재)"
  # 장기 사용자 메모리 도구 탐색 (Phase 2 Slice 2a) — 과거 지시·선호·별칭·작업 이력 조회.
  # 장기 메모리는 사용자에게 내놓는 메뉴가 아니라 내부 기능이다 — 안내에서만 뺀다.
  # advertise:false = "무엇을 할 수 있어?" 답변·도메인 라벨에서 제외(_enabled_domains).
  # enabled:true 는 유지해야 한다 — memory_read_scene·recall_conversation 이 retrieved 티어라
  # 이 관문으로 발견된다. 2026-09-08 에 안내를 끄려고 enabled 를 내렸다가 그 둘이 고아가 됐고,
  # 매 턴 주입되는 회상 안내문은 여전히 이 관문을 가리켜 죽은 지시가 됐다.
  find_memory_tools:
    enabled: true
    advertise: false
    exposure: core
    description: "장기 사용자 메모리 도구 탐색 — 과거 지시·선호, 별칭(표현→실제 대상), 업무 사실, 지난 작업 이력 조회"
  # 명시적 저장 — "기억해둬/앞으로 ~해"는 언제든 오므로 발견 없이 상시 바인딩(core).
  memory_remember:
    enabled: true
    exposure: core
    description: "사용자가 명시한 지시·선호·사실을 장기 기억에 저장 ('앞으로 ~해','기억해둬'; 실시간 값 제외)"
  # 잊기/정정 — "그거 잊어줘/취소"도 언제든 오므로 상시 바인딩(core). memory_remember 의 반대.
  memory_forget:
    enabled: true
    exposure: core
    description: "잘못 저장됐거나 맞지 않는 기억 1건을 삭제 ('그거 잊어줘','~취소'; memory_search 로 id 확보 후 호출)"
  # 검색 도구 — 회상 안내가 "부족하면 memory_search" 를 가리키므로 발견 없이 상시 바인딩(core).
  memory_search:
    enabled: true
    exposure: core
    description: "사용자 장기 메모리 검색 — 과거에 밝힌 지시·선호·별칭·사실·작업 이력을 질의로 조회 (본인 것만, 실시간 값 제외)"
  recall_conversation:
    enabled: true
    exposure: retrieved
    description: "사용자 과거 대화 원문 검색 — 정제 메모리가 아닌 실제 오갔던 대화를 세션 넘어 조회 (본인 것만)"
  # 메모리 v2 L2 장면 문서 전문 읽기 — 시스템 프롬프트의 장면 내비게이션에서 이름을 보고 깊이 읽을 때.
  memory_read_scene:
    enabled: true
    exposure: retrieved
    description: "장기 메모리 장면 문서 전문 읽기 — 프롬프트의 '기억 장면' 목록에 있는 이름으로 프로젝트·루틴 맥락 전체를 열람 (본인 것만)"

  # 가이드 KB 검색 — guide 모드 전용에서 agent(ReAct) 모드 CORE 로 확장 (통합 1단계).
  # core 인 이유: "~어떻게 해?" how-to 질문은 도메인 탐색(find_*_tools)으로 가지 않고
  # 곧바로 들어오며, 도구가 안 붙으면 3갈래 분기 문구(prompt_guidance)도 함께 사라진다.
  # ※ 끄면 agent 모드만 꺼진다 — guide 모드는 orchestrator 가 별도 인스턴스로 직접 실행.
  search_user_guide_kb:
    enabled: true
    exposure: core
    description: "Agent 사용자 가이드 검색 — 사용법·절차·정책·기능유무 how-to 질문 전용 (실 데이터 조회 아님)"

  # 사내 디렉터리(사람 찾기) — 도메인 횡단(회의·DM·담당자 확인)이라 상시 노출(core).
  # 범위는 Frappe 가 요청자 계열사로 스코핑. Mattermost 사용자 검색을 대체한다.
  search_colleagues:
    enabled: true
    exposure: core
    description: "사내 디렉터리에서 이름·직책·부서로 동료(사람) 검색·나열 (계열사 범위, 부서/회사 필터)"

  # 조직 구조 browse — 사람 검색(search_colleagues)과 한 묶음이라 상시 노출(core).
  # 범위는 Frappe 가 요청자 계열사로 스코핑.
  list_departments:
    enabled: true
    exposure: core
    description: "계열사 범위 부서 목록 조회 (본부→팀 계층, 부서별 인원수)"

  list_designations:
    enabled: true
    exposure: core
    description: "계열사 범위 직책(Designation) 종류 조회 (직급 level, 직책별 인원수)"

  list_companies:
    enabled: true
    exposure: core
    description: "요청자 계열사 그룹의 회사 목록 조회 (회사별 인원수)"

  database:
    enabled: true
    description: "Query the database for structured data"
    timeout: 30

  # 표·글을 한 도구로 합쳤다(2026-09-10). 두 도구로 나눠 뒀을 때 모델이 **둘 중 아무것도
  # 부르지 않고** 전송 도구에 없는 파일명을 지어 넣는 실패가 실측됐다 — 선택지를 하나로
  # 줄여 "무엇을 부를까" 판단을 없앤다. CORE 정원(_CORE_CAP=15) 초과 완화도 겸한다.
  create_file:
    enabled: true
    exposure: core
    description: "내용을 실제 파일로 생성 — 엑셀(.xlsx)·워드(.docx)·마크다운(.md)·텍스트(.txt). '엑셀로 만들어줘'·'보고서 파일로 줘' 류 요청"

  calculator:
    enabled: true
    exposure: core
    description: "Perform mathematical calculations"
    precision: 10

  # Mattermost 스킬 — 도메인 도구라 질의 검색 노출
  mattermost_skill_get_channel_messages:
    enabled: true
    exposure: retrieved
    description: "채널명·사용자명으로 Mattermost 메시지 조회 (ID 자동 해결) — 각 메시지의 **첨부 파일명·file_id 포함**(방금 올라온 파일은 색인 대신 이걸로 찾는다)"

  mattermost_skill_get_direct_messages:
    enabled: true
    exposure: retrieved
    description: "사용자 이름으로 DM 메시지 조회"

  mattermost_skill_get_unread_messages:
    enabled: true
    exposure: retrieved
    description: "안 읽은 멘션 조회 — 나를 멘션했거나 내게 온 DM 중 안 읽은 것(빨간 배지 기준)을 모든 채널/DM에서 본문까지 모아 조회"

  # 나를 태그한 메시지 — core(상시 바인딩). 이유는 provider.py 정책 주석 참조:
  # 의미검색은 색인의 `@영문ID`와 질문의 한글 이름을 잇지 못해 원리적으로 못 찾는다.
  mattermost_skill_find_my_mentions:
    enabled: true
    exposure: core
    description: "나를 태그·멘션·언급한 메시지 조회 — '나 태그한 거', '누가 날 불렀어', '내 이름 언급된 글'을 기간별로 전 채널에서 정확히 조회(읽음 여부 무관)"

  # 작성자로 글 찾기 — core(상시 바인딩). 이유는 provider.py 정책 주석 참조:
  # 의미검색은 작성자 조건을 표현할 수 없어 "○○님이 공유한 ~" 에 다른 사람 글을 답한다.
  mattermost_skill_find_posts_by_author:
    enabled: true
    exposure: core
    description: "특정 사람이 작성한 글 조회 — '김철수 이사님이 공유한 링크', '내가 올린 문서', '○○님이 쓴 글'을 작성자 조건(from:)으로 정확히 검색(author 생략 시 본인, 기간 미지정 시 전체)"

  mattermost_skill_get_my_channels:
    enabled: true
    exposure: retrieved
    description: "요청자가 속한 Mattermost 팀/채널 목록 조회"

  mattermost_skill_find_channels:
    enabled: true
    exposure: retrieved
    description: "자연어 query로 관련 Mattermost 채널 탐색 (채널명 모를 때 사용)"

  mattermost_skill_send_dm:
    enabled: true
    exposure: retrieved

  mattermost_skill_react:
    enabled: true
    exposure: retrieved

  mattermost_post_message:
    enabled: true
    exposure: retrieved

  mattermost_open_screen:
    enabled: true
    exposure: retrieved
    description: "메신저 고정 화면(관리자 콘솔·스레드·임시글·관리자화면 등) 열기 (조회·전송 없이 화면 이동)"

  # 사내 지식 RAG — 문서/이슈/문제/논의/결정 검색, 주제·프로젝트·회의명 직접 질의가 잦아
  # 상시 노출(core). 다른 mattermost_* 스킬과 달리 find_messenger_tools 발견을 거치지 않는다.
  # (실제 LLM description 은 MCP 서버 server.py 가 소유 — 여기 설명은 운영 참고용)
  mattermost_search_knowledge:
    enabled: true
    exposure: core
    description: "사내 메신저 대화에서 과거 이슈·문제·논의·결정·공유 문서를 의미 검색 (최근 N일 등 기간 지정, 주제·프로젝트·회의명만으로도 검색)"

  # 첨부문서 전문 읽기 — 위 검색이 주는 text 는 문서의 한 조각(청크)이라 그것만으로
  # 요약하면 내용이 잘린다. **core 여야 한다**: 이 도구는 검색 결과를 받은 다음 턴에
  # file_id 로 불려서 원 질의와의 유사도가 낮아, retrieved 로 두면 발견에 실패한다.
  # ⚠ 이 항목이 없으면 정책·MCP 등록이 다 돼 있어도 워커 도구 목록에 안 들어간다
  #   (2026-08-24 실측: 등록 11개인데 talk 워커 목록에 read_file 부재 → 요약 전면 실패).
  mattermost_read_file:
    enabled: true
    exposure: core
    description: "메신저 첨부파일(PDF·한글hwp/hwpx·워드·엑셀·PPT·이미지)의 본문 전체를 읽어온다 — 검색 결과의 file_id 로 호출, 요약·분석 전에 필수"

  # 스레드 단위 조회 — "이 스레드", "여기 올라온 파일" 을 가리키는 요청의 정확한 수단.
  # 채널 조회(get_channel_messages)는 채널 최근 글만 훑어 스레드를 집지 못한다.
  # ⚠ 위 read_file 과 같은 이유로 **core** 여야 한다(프롬프트 [현재 위치]의 post_id 로
  #   바로 불려 질의 문장과의 유사도가 낮다).
  mattermost_read_thread:
    enabled: true
    exposure: core
    description: "지금 이 스레드(또는 지정한 스레드)의 글과 첨부 목록을 시간순으로 읽어온다 — 첨부 file_id·파일명 포함"

  # mailcow MCP 도구 (mailcow-mcp 서버에서 동적 등록)
  mail_list_messages:
    enabled: true
    exposure: retrieved
    description: "본인 메일함 목록 조회 (검색어·기간·안읽음 필터)"

  mail_read_message:
    enabled: true
    exposure: retrieved
    description: "메일 1건 본문·첨부 메타 조회"

  mail_send_message:
    enabled: true
    exposure: retrieved
    description: "본인 계정으로 텍스트 메일 발송"

  mail_save_contact:
    enabled: true
    exposure: retrieved
    description: "명함/문서에서 읽은 연락처(이름·전화·이메일·회사)를 메일 주소록에 저장"

  mail_open_screen:
    enabled: true
    exposure: retrieved
    description: "웹메일 특정 화면(받은/보낸메일함·설정·주소록 등) 열기 (조회·발송 없이 화면 이동)"

  # Nextcloud MCP 도구 (nextcloud-mcp 서버에서 동적 등록 — 게이트웨이 세션 패스스루)
  calendar_list_events:
    enabled: true
    exposure: retrieved
    description: "일정 조회 — 기간·키워드·둘 다 (옛 calendar_search_events 를 흡수, 조회·검색 도구는 이것 하나)"

  calendar_create_event:
    enabled: true
    exposure: retrieved
    description: "일정 등록"

  calendar_update_event:
    enabled: true
    exposure: retrieved
    description: "일정 부분 수정 (uid 기준)"

  calendar_delete_event:
    enabled: true
    exposure: retrieved
    description: "일정 삭제 (uid 기준)"

  calendar_open_screen:
    enabled: true
    exposure: retrieved
    description: "캘린더(월간뷰) 화면 열기 (조회 없이 화면 이동)"

  drive_list_files:
    enabled: true
    exposure: retrieved
    description: "드라이브 폴더 내용 조회"

  drive_search_files:
    enabled: true
    exposure: retrieved
    description: "드라이브 파일명 검색 (하위 폴더 포함)"

  drive_read_file:
    enabled: true
    exposure: retrieved
    description: "드라이브 파일 본문 읽기 — **스캔 PDF·이미지(사진·캡처) 포함**. 내용 질문은 반드시 이 도구로 (목록·검색은 파일명만 준다)"

  drive_create_share_link:
    enabled: true
    exposure: retrieved
    description: "파일/폴더 읽기전용 공유 링크 생성"

  drive_open_screen:
    enabled: true
    exposure: retrieved
    description: "드라이브(파일) 홈 화면 열기 (조회 없이 화면 이동)"

  # HR MCP 도구 (hr-mcp 서버 — Horilla 직통, 구 hr_service_* 대체)
  hr_my_attendance:
    enabled: true
    exposure: retrieved
    description: "본인 근태(출퇴근) 기록 조회"
  hr_today_attendance:
    enabled: true
    exposure: retrieved
    description: "본인 오늘 출근 상태"
  hr_attendance_requests:
    enabled: true
    exposure: retrieved
    description: "근태 정정 승인 대기 건 조회(건수·목록) — 결재자는 결재할 건, 일반 사용자는 본인 신청 건"
  hr_overtime_hours:
    enabled: true
    exposure: retrieved
    description: "본인 초과근무 누적 시간"
  hr_leave_balance:
    enabled: true
    exposure: retrieved
    description: "본인 잔여 연차·휴가"
  hr_leave_types:
    enabled: true
    exposure: retrieved
    description: "회사 휴가 종류 목록 조회"
  hr_my_payslips:
    enabled: true
    exposure: retrieved
    description: "본인 급여명세 목록"
  # 휴가 신청/취소는 전자결재(휴가신청서 상신)로 이관 → HR 쓰기 도구 제외.
  # (hr_request_leave / hr_cancel_leave 는 HR-MCP 에서 노출하지 않는다 — 휴가 신청은 결재 도메인 몫.)
  hr_request_attendance_correction:
    enabled: true
    exposure: retrieved
    description: "근태 기록 정정 신청"

  hr_open_screen:
    enabled: true
    exposure: retrieved
    description: "HR 화면(근태·휴가·급여명세·관리자화면 등) 열기 (데이터 조회 없이 화면 이동)"

  vector_search:
    enabled: true
    description: "Search through vector embeddings"
    top_k: 5
    score_threshold: 0.7

# 도구 사용 제한
limits:
  max_tool_calls_per_run: 20
  tool_timeout: 60

# 도구 조합 규칙
combinations:
  research:
    - search
    - vector_search
  data_analysis:
    - database
    - calculator
