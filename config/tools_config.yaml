  # 사내 지식 RAG — 문서/이슈/문제/논의/결정 검색, 주제·프로젝트·회의명 직접 질의가 잦아
  # 상시 노출(core). 다른 mattermost_* 스킬과 달리 find_messenger_tools 발견을 거치지 않는다.
  # (실제 LLM description 은 MCP 서버 server.py 가 소유 — 여기 설명은 운영 참고용)
  mattermost_search_knowledge:
    enabled: true
    exposure: core
    description: "사내 메신저 대화에서 과거 이슈·문제·논의·결정·공유 문서를 의미 검색 (최근 N일 등 기간 지정, 주제·프로젝트·회의명만으로도 검색)"

  # 첨부문서 전문 읽기 — 위 검색이 주는 text 는 문서의 한 조각(청크)이라 그것만으로
  # 요약하면 내용이 잘린다. **core 여야 한다**: 이 도구는 검색 결과를 받은 다음 턴에
  # file_id 로 불려서 원 질의와의 유사도가 낮아, retrieved 로 두면 발견에 실패한다.
  # ⚠ 이 항목이 없으면 정책·MCP 등록이 다 돼 있어도 워커 도구 목록에 안 들어간다
  #   (2026-08-24 실측: 등록 11개인데 talk 워커 목록에 read_file 부재 → 요약 전면 실패).
  mattermost_read_file:
    enabled: true
    exposure: core
    description: "메신저 첨부파일(PDF·한글hwp/hwpx·워드·엑셀·PPT·이미지)의 본문 전체를 읽어온다 — 검색 결과의 file_id 로 호출, 요약·분석 전에 필수"

  # 스레드 단위 조회 — "이 스레드", "여기 올라온 파일" 을 가리키는 요청의 정확한 수단.
  # 채널 조회(get_channel_messages)는 채널 최근 글만 훑어 스레드를 집지 못한다.
  # ⚠ 위 read_file 과 같은 이유로 **core** 여야 한다(프롬프트 [현재 위치]의 post_id 로
